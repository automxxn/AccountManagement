# v로 시작하는 태그(예: v1.0.1)를 올리면 exe를 빌드해서 GitHub Release로 배포한다.
# 프로그램은 실행할 때 최신 Release를 확인해서 자동으로 업데이트한다.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Check version.py matches tag
        shell: pwsh
        run: |
          $v = python -c "from acctmgr.version import __version__; print(__version__)"
          if ("v$v" -ne "${{ github.ref_name }}") { throw "acctmgr/version.py ($v) 와 태그(${{ github.ref_name }})가 달라요" }

      - name: Build exe
        shell: pwsh
        run: ./build.ps1

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/AccountManagement.exe dist/AccountManagement.exe.sha256 `
            --title "AccountManagement ${{ github.ref_name }}" --notes-file RELEASE_NOTES.md
